<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Обкладинка ролика — Моя вулиця</title>
<link rel="stylesheet" href="brend.css">
<style>
/* Макет 540×960, рендер ×2 = 1080×1920 (TikTok, YouTube Shorts, Reels).
   Заголовок — у середній смузі 230–700 px макета: він лишається і в сітці профілю
   Instagram (обрізка 1:1 і 4:5), і поза кнопками TikTok (нижні 20 %, праві 15 %). */
.polotno { width: 540px; height: 960px; }
#soty { position: absolute; inset: 0; }
.vmist { position: absolute; left: 32px; width: 420px; top: 230px; height: 470px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.zahalovok { font: 800 58px/62px Manrope, sans-serif; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
.zahalovok.dovgyi { font-size: 46px; line-height: 50px; }
.pidzahalovok { font: 400 22px/30px Inter, sans-serif; color: var(--ink-2); margin: 0; }
.mitka { align-self: flex-start; font-size: 14px; line-height: 20px; padding: 6px 14px; }
.znak-blok { position: absolute; left: 32px; top: 150px; }
.ramka { position: absolute; left: 0; top: 0; width: 459px; height: 768px; outline: 1px dashed var(--attention); display: none; }
.ramka2 { position: absolute; left: 0; top: 210px; width: 540px; height: 540px; outline: 1px dashed var(--accent); display: none; }
.pokazaty-zonu .ramka, .pokazaty-zonu .ramka2 { display: block; }
</style></head>
<body><div class="polotno" id="p">
<svg id="soty" width="540" height="960" viewBox="0 0 540 960" aria-hidden="true"></svg>
<div class="znak-blok"><span class="znak" id="znak"><b>Моя вулиця</b></span></div>
<div class="vmist"><span class="mitka" id="seriya"></span>
<p class="zahalovok" id="zahalovok"></p><p class="pidzahalovok" id="pidzahalovok"></p></div>
<div class="ramka"></div><div class="ramka2"></div>
</div>
<script src="brend.js"></script>
<script>
window.pokazaty = function (d) {
  var svg = document.getElementById('soty');
  Brend.sotyPole(svg, 0, 790, 16, 5, 22, Brend.SHKALA.slice(0, 4), function (x, y) { return y === 0 && x > 8; });
  Brend.sotyPole(svg, 250, 20, 6, 4, 22, Brend.SHKALA.slice(0, 3), function (x, y) { return x < 3 - y; });
  var slab = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  slab.setAttribute('x', 470); slab.setAttribute('y', -10); slab.setAttribute('width', 80); slab.setAttribute('height', 980);
  slab.style.fill = 'var(--accent)'; svg.appendChild(slab);
  document.getElementById('znak').prepend(Brend.znak(30));
  Brend.tekst('seriya', d.seriya);
  Brend.tekst('zahalovok', d.zahalovok);
  if ((d.zahalovok || '').length > 28) document.getElementById('zahalovok').classList.add('dovgyi');
  Brend.tekst('pidzahalovok', d.pidzahalovok);
  if (d.pokazaty_zonu) document.getElementById('p').classList.add('pokazaty-zonu');
  Brend.maket(d);
};
</script></body></html>
