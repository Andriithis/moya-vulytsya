<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Пост «Вулиця в цифрах» — Моя вулиця</title>
<link rel="stylesheet" href="brend.css">
<style>
/* Макет 540×675, рендер ×2 = 1080×1350 (4:5, Instagram і Facebook). */
.polotno { width: 540px; height: 675px; padding: 32px 32px 24px; display: flex; flex-direction: column; }
.verkh { display: flex; justify-content: space-between; align-items: center; }
h1 { margin: 22px 0 6px; }
.fakty { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.fakt { display: flex; gap: 16px; align-items: center; padding: 14px 18px; }
.fakt .number { font-size: 40px; line-height: 44px; color: var(--accent); min-width: 128px; }
.fakt .body { color: var(--ink-2); }
.roky { margin-top: 24px; }
.roky .stovptsi { display: flex; gap: 8px; align-items: flex-end; height: 104px; margin-top: 10px; }
.roky .st { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.roky .st i { display: block; width: 100%; border-radius: var(--radius-s) var(--radius-s) 0 0; }
.roky .st span { font: 600 12px/16px Plex, system-ui, sans-serif; color: var(--ink-2); }
.roky .os { display: flex; gap: 8px; margin-top: 4px; }
.roky .os span { flex: 1; text-align: center; font: 400 12px/16px Plex, system-ui, sans-serif; color: var(--muted); }
.niz { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.niz .caption { max-width: 330px; }
</style></head>
<body><div class="polotno" id="p">
<div class="verkh"><span class="znak" id="znak"><b>Моя вулиця</b></span><span class="micro">Вулиця в цифрах</span></div>
<h1 class="title-1" id="vulytsya"></h1>
<p class="body-s" id="pidpys" style="color:var(--muted)"></p>
<div class="fakty" id="fakty"></div>
<div class="roky" id="roky" hidden><span class="micro" id="roky-nazva">Подій за роками</span>
<div class="stovptsi" id="stovptsi"></div><div class="os" id="os"></div>
<p class="caption" id="roky-prymitka" style="margin-top:6px"></p></div>
<div class="niz"><p class="caption"><span id="dzherelo"></span> Лише те, що дійшло до суду.<br>Колір — кількість подій у даних, не небезпека.</p>
<span class="mitka" id="adresa-saitu"></span></div>
</div>
<script src="brend.js"></script>
<script>
window.pokazaty = function (d) {
  document.getElementById('znak').prepend(Brend.znak(26));
  Brend.tekst('vulytsya', d.vulytsya);
  Brend.tekst('pidpys', d.pidpys);
  var f = document.getElementById('fakty');
  (d.fakty || []).forEach(function (x) {
    var k = document.createElement('div'); k.className = 'kartka fakt';
    var n = document.createElement('span'); n.className = 'number'; n.textContent = Brend.chyslo(x.chyslo);
    var t = document.createElement('p'); t.className = 'body'; t.textContent = x.tekst;
    k.appendChild(n); k.appendChild(t); f.appendChild(k);
  });
  if (d.roky && d.roky.length) {
    document.getElementById('roky').hidden = false;
    var max = Math.max.apply(null, d.roky.map(function (r) { return r.podii; }));
    var st = document.getElementById('stovptsi'), os = document.getElementById('os');
    d.roky.forEach(function (r) {
      var c = document.createElement('div'); c.className = 'st';
      var v = document.createElement('span'); v.textContent = Brend.chyslo(r.podii);
      var i = document.createElement('i');
      i.style.height = Math.max(4, Math.round(96 * r.podii / max)) + 'px';
      /* Шкала даних: більше подій — темніший крок; неповний рік — світлий з рамкою. */
      var krok = Math.min(4, Math.floor(r.podii / max * 4.999));
      i.style.background = Brend.SHKALA[Math.max(1, krok)];
      if (r.nepovnyi) { i.style.background = 'var(--data-2)'; i.style.outline = '1px dashed var(--line-strong)'; i.style.outlineOffset = '-1px'; }
      c.appendChild(v); c.appendChild(i); st.appendChild(c);
      var o = document.createElement('span'); o.textContent = r.rik + (r.nepovnyi ? '*' : ''); os.appendChild(o);
    });
    Brend.tekst('roky-prymitka', d.roky_prymitka);
  }
  Brend.tekst('dzherelo', d.dzherelo || 'Дані: судові рішення ЄДРСР');
  Brend.tekst('adresa-saitu', d.adresa_saitu);
  Brend.maket(d);
};
</script></body></html>
