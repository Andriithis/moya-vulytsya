// ---- Варіант і шрифт: параметри адреси (камера — у #хеші, тож при зміні варіанта місце лишається) ----
const parU=new URLSearchParams(location.search);
const VAR=['a','b','v'].includes(parU.get('v'))?parU.get('v'):'a';
const SHR=['1','2','3'].includes(parU.get('f'))?parU.get('f'):'1';
// А «Спокійна»: 2D, світла; Б «Вершини»: 3D, світла; В «Нічне місто»: 3D, темна.
const VAR_CFG={
 a:{mode:'soty',tema:'svitla'},
 b:{mode:'stovp',tema:'svitla'},
 v:{mode:'stovp',tema:'temna'}}[VAR];
document.body.dataset.v=VAR; document.body.dataset.f=SHR;
function pereity(k,v){const p=new URLSearchParams(location.search); p.set(k,v); if(k==='v') p.delete('tema');
 location.href=location.pathname+'?'+p+location.hash}
document.querySelectorAll('[data-var]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.var===VAR)); b.onclick=()=>b.dataset.var!==VAR&&pereity('v',b.dataset.var)});
document.querySelectorAll('[data-shr]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.shr===SHR));
 // шрифт міняється без перезавантаження: це лише CSS
 b.onclick=()=>{document.body.dataset.f=b.dataset.shr; const p=new URLSearchParams(location.search); p.set('f',b.dataset.shr);
  history.replaceState(null,'',location.pathname+'?'+p+location.hash);
  document.querySelectorAll('[data-shr]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}});

// ---- Соти: сітка, рівні, перехід (М3) ----
const MX_=111320*Math.cos(50.45*Math.PI/180), MY_=111320;
const HEXG=[{id:'L',R:330},{id:'S',R:130}];
const HRUPY=D.hrupy, GN=HRUPY.length;
const POROH=12.3, SMUHA=.4, ZUM_BUDYNKIV=14.5;
// Нижній клас на рівні міста схований: інакше околиці вкриває «пил» з поодиноких подій.
const ZUM_SLABKYKH=11.4;
const colG=(z=map.getZoom())=>z<POROH?'L':'S';
const COL_ZUM={L:[0,POROH],S:[POROH,24]};
const HEX_FADE={L:[[0,1],[11.9,1],[POROH,0]],S:[[POROH,0],[12.7,1]]};
const MNOZHNYK={L:[[0,1],[POROH-SMUHA,1],[POROH,0]],S:[[POROH,0],[POROH+SMUHA,1],[14,.5],[15,.2],[16.5,.08]]};
// Проміжок між сотами — 13 % (шестикутник займає 87 % клітинки).
const KLITYNKA=.87;
function hexPoly(cx,cy,R,k=1){const out=[];
 for(let a=0;a<6;a++){const t=Math.PI/180*(60*a+30); out.push([(cx+k*R*Math.cos(t))/MX_,(cy+k*R*Math.sin(t))/MY_])}
 out.push(out[0]); return [out]}
const rgb=c=>{const v=parseInt(c.slice(1),16); return [v>>16,(v>>8)&255,v&255]};
const hexK=a=>'#'+a.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
const MAKS_KANAL=236;
function zmishaty(c,tsil,k){const a=rgb(c).map((x,i)=>x+(tsil[i]-x)*k), m=Math.max(...a); return hexK(m>MAKS_KANAL?a.map(x=>x*MAKS_KANAL/m):a)}

// ---- Шкала кольору: 5 кроків, OKLCH, один відтінок (h ≈ 192°), перевірено валідатором dataviz ----
// Світла: L 0,745 → 0,385 (L* 71,5 · 61,2 · 50,7 · 40,1 · 29,4); найсвітліший крок — 2,03:1 до тла #F7F6F2.
// Темна: L 0,43 → 0,83 (L* 34,6 · 46,5 · 58,3 · 70,3 · 81,6); найтемніший крок — 2,33:1 до тла #111517.
const SHKALA={svitla:['#76BBB8','#41A29F','#068784','#026A68','#034E4D'],temna:['#205A58','#237A78','#2F9B98','#45BDB9','#70DCD8']};
// Межі класів — частки сот із подіями. А і В: квінтилі. Б: верхні 15 % — два верхні класи (справжні вершини).
const KVANTYLI=VAR==='b'?[.4,.7,.85,.95]:[.2,.4,.6,.8];
let TEMA=VAR_CFG.tema;
if(SHKALA[parU.get('tema')]) TEMA=parU.get('tema');
document.body.dataset.t=TEMA;
const AKTYVNI=new Set(HRUPY.map((h,i)=>i));
let MEDIANA=D.meta.mediana130, POR={L:[],S:[]};
const HEXB={L:new Map(),S:new Map()};
const C0=[D.meta.centr[1]*MX_,D.meta.centr[0]*MY_];
for(const G of HEXG){
 const rows=D.soty[G.id]; let dmax=1;
 for(const r of rows) dmax=Math.max(dmax,Math.hypot(r[1]-C0[0],r[2]-C0[1]));
 HEXB[G.id]=new Map(rows.map(r=>[r[0],{k:r[0],cx:r[1],cy:r[2],n:r[3],g:r[4],y:r[5],pik:r[6],pikN:r[7],chasN:r[8],rayon:D.rayony[r[9]]||'',oriyentyr:D.oriyentyry[r[10]]||'',pr:r[11],nf:r[3],gf:r[4],kr:0,
  d:Math.min(1,Math.hypot(r[1]-C0[0],r[2]-C0[1])/dmax)}]))}
function pererakhuvaty(){
 for(const G of HEXG){const bs=[...HEXB[G.id].values()];
  for(const b of bs){b.gf=b.g.map((v,i)=>AKTYVNI.has(i)?v:0); b.nf=b.gf.reduce((x,y)=>x+y,0)}
  const zi=bs.filter(b=>b.nf>0).sort((a,b)=>a.nf-b.nf), L_=zi.length;
  POR[G.id]=KVANTYLI.map(q=>L_?zi[Math.min(L_-1,Math.floor(L_*q))].nf:0);
  // сота з тим самим числом завжди одного кольору
  zi.forEach(b=>{b.kr=POR[G.id].filter(x=>b.nf>=x).length});
  G.p98=Math.max(1,L_?zi[Math.min(L_-1,Math.floor(L_*.98))].nf:1);
  G.p85=Math.max(1,L_?zi[Math.min(L_-1,Math.floor(L_*.85))].nf:1);
  if(G.id==='S'){const ns=zi.map(b=>b.nf); MEDIANA=L_?(L_%2?ns[(L_-1)/2]:(ns[L_/2-1]+ns[L_/2])/2):0}}}
// Висота за коренем з обрізанням на p98; мінімум 4 % — одна подія не зливається з нулем. Висота дублює колір (те саме число).
// Б: до p85 соти низькі (до 10 % висоти), вище — стовпчики; залежність усе одно монотонна.
function chastkaVysoty(G,n){const x=Math.min(n,G.p98);
 if(VAR!=='b') return .04+.96*Math.sqrt(x/G.p98);
 if(x<=G.p85) return .03+.07*Math.sqrt(x/G.p85);
 return .10+.90*Math.sqrt((x-G.p85)/Math.max(1,G.p98-G.p85))}
const H_MAKS={a:3.5,b:4.2,v:3.5}[VAR];
// Прозорість 2D за класом: у А виділяються лише верхні класи, нижні — ледь-ледь, крізь них видно вулиці.
const PROZ_2D={a:{svitla:[.16,.24,.36,.64,.86],temna:[.24,.32,.44,.68,.88]},b:{svitla:[.62,.70,.78,.86,.92],temna:[.62,.70,.78,.86,.92]},v:{svitla:[.62,.70,.78,.86,.92],temna:[.60,.68,.78,.88,.95]}}[VAR];
function hexData(G,cols){const B=[...HEXB[G.id].values()].filter(b=>b.nf>0), tem=TEMA==='temna';
 const poly=(b,k)=>({type:'Polygon',coordinates:hexPoly(b.cx,b.cy,G.R,k)});
 if(!cols) return {type:'FeatureCollection',features:B.map(b=>({type:'Feature',geometry:poly(b,KLITYNKA),
  properties:{k:b.k,c:SHKALA[TEMA][b.kr],a:PROZ_2D[TEMA][b.kr],slab:b.kr===0?1:0,d:b.d,n:b.nf}}))};
 const KANT=G.R/40, E1=1.5, E2=1.5, VYSOTA=G.R*H_MAKS;
 // Об'єм: боки темніші за крок шкали, тонкий світлий обідок і дах трохи світліший (М3). У Б обідок яскравіший.
 const barvy=c=>({tilo:zmishaty(c,[0,0,0],tem?.35:.2),kant:zmishaty(c,[255,255,255],tem?.25:VAR==='b'?.55:.4),dakh:zmishaty(c,[255,255,255],tem?.04:VAR==='b'?.2:.12)});
 const chastyna=(b,k,c,bh,eb,eh,h)=>({type:'Feature',geometry:poly(b,k),properties:{k:b.k,c,cl:zmishaty(c,[255,255,255],.45),n:b.nf,h,bh,eb,eh,slab:b.kr===0?1:0,d:b.d}});
 return {type:'FeatureCollection',features:B.flatMap(b=>{
  const h=VYSOTA*chastkaVysoty(G,b.nf), c=barvy(SHKALA[TEMA][b.kr]);
  return [chastyna(b,KLITYNKA,c.tilo,0,0,0,h),
   chastyna(b,KLITYNKA,c.kant,h,-KANT,E1,h),
   chastyna(b,KLITYNKA*.93,c.dakh,h,E1,E1+E2,h)]})}}
pererakhuvaty();

// ---- Поява: соти один раз «виростають» хвилею від центру (≤ 800 мс); вимикається за prefers-reduced-motion ----
let ROST=TYKHO?1:0;
// Частка росту соти: стартує із затримкою за відстанню від центру (до 0,3 часу), далі ease-out.
const rostVyraz=()=>{if(ROST>=1) return 1;
 const x=['min',1,['max',0,['/',['-',ROST,['*',.3,['get','d']]],.7]]];
 return ['*',x,['-',2,x]]};
// Вираз за зумом зі сталими множниками в кожній точці (зум у MapLibre — лише на верхньому рівні виразу).
function zaZumom(tochky,f){const t=[...new Set(tochky)].sort((a,b)=>a-b); return ['interpolate',['linear'],['zoom'],...t.flatMap(z=>[z,f(z)])]}
const interp=(st,z)=>{if(z<=st[0][0]) return st[0][1]; for(let i=1;i<st.length;i++){const [z1,v1]=st[i],[z0,v0]=st[i-1]; if(z<=z1) return v0+(v1-v0)*(z-z0)/(z1-z0)} return st[st.length-1][1]};
const TOCHKY={L:[0,10.8,ZUM_SLABKYKH,11.9,POROH-SMUHA,POROH],S:[POROH,POROH+SMUHA,12.7,14,15,16.5]};
// Нижній клас 330 м: 0 до зуму 10,8, ледь видно до 11,4, далі як усі.
const slabkyi=(id,z)=>id==='S'?1:z<=10.8?0:Math.min(1,(z-10.8)/(ZUM_SLABKYKH-10.8));
function proz2d(id){const r=rostVyraz();
 return zaZumom(TOCHKY[id],z=>['*',['get','a'],interp(HEX_FADE[id],z),r,['case',['==',['get','slab'],1],slabkyi(id,z),1]])}
function vysota(id,H,E){const r=rostVyraz();
 return zaZumom(TOCHKY[id],z=>['max',0,['+',['*',interp(MNOZHNYK[id],z),r,['get',H]],['*',r,['get',E]]]])}
function zastosuvatyRist(){for(const G of HEXG){const id=G.id;
 if(map.getLayer('k-hex-'+id)) map.setPaintProperty('k-hex-'+id,'fill-opacity',proz2d(id));
 for(const s of ['','-slab']) if(map.getLayer('k-col'+s+'-'+id)){
  map.setPaintProperty('k-col'+s+'-'+id,'fill-extrusion-base',vysota(id,'bh','eb'));
  map.setPaintProperty('k-col'+s+'-'+id,'fill-extrusion-height',vysota(id,'h','eh'))}}}
function vyrosty(){if(TYKHO||ROST>=1) return; const t0=performance.now(), T=800;
 const krok=t=>{ROST=Math.min(1,(t-t0)/T); zastosuvatyRist(); if(ROST<1) requestAnimationFrame(krok); else MAKET.stan.vyrosly=true};
 requestAnimationFrame(krok)}

// ---- Підкладка OpenFreeMap: тепла positron, темна dark; у В — притлумлена ----
const STYLI={svitla:'https://tiles.openfreemap.org/styles/positron',temna:'https://tiles.openfreemap.org/styles/dark'};
const TEPLA={background:'#F7F6F2',water:'#D5DEDD',landuse_residential:'#F3F1EA',landcover_wood:'#E9EBE0',landuse_park:'#E9EBE0',park:'#E9EBE0',building:'#ECE9E1'};
const NICH={background:'#111517',water:'#16201F',landuse_park:'#18201E',landcover_wood:'#18201E',park:'#18201E',building:'#141A1C'};
const NICH_V={background:'#0C1012',water:'#111A1C',landuse_park:'#121816',landcover_wood:'#121816',park:'#121816',building:'#0F1416'};
const UK_NAME=['coalesce',['get','name:uk'],['get','name']];
function patchStyle(s,t){
 const layers=s.layers.filter(l=>!(l.type==='symbol'&&(/shield/.test(l.id)||l['source-layer']==='poi')));
 let font=null,tc='#888',th='#fff';
 for(const l of layers){ if(l.type!=='symbol'||!l.layout) continue;
  const tf=l.layout['text-field']; if(tf&&JSON.stringify(tf).includes('name')) l.layout['text-field']=UK_NAME;
  if(!font&&l['source-layer']==='transportation_name'&&l.layout['text-font']){font=l.layout['text-font']; const p=l.paint||{};
   if(typeof p['text-color']==='string') tc=p['text-color']; if(typeof p['text-halo-color']==='string') th=p['text-halo-color']}}
 const src=Object.keys(s.sources).find(k=>s.sources[k].type==='vector');
 if(src&&font){const txt=(id,sl,minzoom,filter,size,extra)=>({id:'base-'+id,type:'symbol',source:src,'source-layer':sl,minzoom,filter,
   layout:{'text-field':UK_NAME,'text-font':font,'text-size':size,...extra},paint:{'text-color':tc,'text-halo-color':th,'text-halo-width':1.2}});
  layers.push(txt('park','poi',14,['==',['get','class'],'park'],11,{'text-max-width':8}),
   txt('metro','poi',13,['all',['==',['get','class'],'railway'],['in',['get','subclass'],['literal',['station','subway']]]],11,{'text-max-width':8,'text-offset':[0,.2]}))}
 const kolory=t==='temna'?(VAR==='v'?NICH_V:NICH):TEPLA;
 for(const l of layers){const c=kolory[l.id];
  if(c){const k=l.type==='background'?'background-color':l.type==='fill'?'fill-color':null; if(k) l.paint={...(l.paint||{}),[k]:c}}
  // Темна тема: будинки підкладки не виступають крізь соти — без обвідки й притлумлені.
  if(t==='temna'&&l.id==='building') l.paint={...(l.paint||{}),'fill-outline-color':kolory.building,'fill-opacity':.5};
  // В: дороги й підписи притлумлені, щоб світились лише дані.
  if(VAR==='v'&&t==='temna'){
   if(l.type==='line'&&l['source-layer']==='transportation') l.paint={...(l.paint||{}),'line-opacity':.55};
   if(l.type==='symbol') l.paint={...(l.paint||{}),'text-opacity':.7}}}
 return {...s,layers}}

const pitch3d=(z=map.getZoom())=>Math.round(45+5*Math.min(1,Math.max(0,(z-10.6)/2.4)));
const maHesh=/^#\d/.test(location.hash);
const map=new maplibregl.Map({container:'map',center:[D.meta.centr[1],D.meta.centr[0]],zoom:telefon()?8.9:10,pitch:VAR_CFG.mode==='stovp'?45:0,maxZoom:19,maxPitch:60,attributionControl:false,hash:true});
map.touchPitch.enable();
const attrEl=document.createElement('div'); attrEl.className='maplibregl-ctrl maplibregl-ctrl-attrib';
const A=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
attrEl.innerHTML='<button class="k-atr-i" aria-label="Джерела даних" title="Джерела даних">ⓘ</button><div class="maplibregl-ctrl-attrib-inner">Підкладка: '+A('https://openfreemap.org','OpenFreeMap')+' © '+A('https://openmaptiles.org','OpenMapTiles')+' · дані © '+A('https://www.openstreetmap.org/copyright','OpenStreetMap')+' (ODbL) · події: '+A('https://reyestr.court.gov.ua','ЄДРСР')+', ДСА України ('+A('https://creativecommons.org/licenses/by/4.0/deed.uk','CC BY')+')</div>';
attrEl.addEventListener('click',e=>{if(e.target.closest('.k-atr-i')) attrEl.classList.toggle('k-atr-vidkr')});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
map.addControl({onAdd:()=>attrEl,onRemove(){}},'bottom-right');
map.setMissingStyleImageResolver(id=>{if(!map.hasImage(id)) map.addImage(id,{width:1,height:1,data:new Uint8Array(4)})});
const postavytyStyl=()=>{const t=TEMA; map.setStyle(STYLI[t],{diff:false,transformStyle:(prev,next)=>patchStyle(next,t)})};
postavytyStyl();
window.MAKET={map,HEXB,HEXG,POR,VAR,stan:{pidkladka:false,plytky:0,pomylky:[],vyrosly:TYKHO}};
map.on('error',e=>MAKET.stan.pomylky.push(String(e&&e.error&&e.error.message)));
map.on('sourcedata',e=>{if(e.tile&&e.sourceId==='openmaptiles'){MAKET.stan.pidkladka=true; MAKET.stan.plytky++}});

let MODE=VAR_CFG.mode, ZARAZ=null;
function layerVis(id,on){if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',on?'visible':'none')}
function namalyuvaty(){for(const G of HEXG){
 layerVis('k-hex-'+G.id,MODE==='soty'); layerVis('k-hexl-'+G.id,MODE==='soty');
 layerVis('k-col-'+G.id,MODE==='stovp'); layerVis('k-col-slab-'+G.id,MODE==='stovp')}
 // Будинки підкладки в 3D не стирчать крізь стовпчики: ховаємо їх, поки видно соти.
 if(map.getLayer('building')) map.setLayoutProperty('building','visibility',MODE==='stovp'&&TEMA==='temna'?'none':'visible')}
const cssv=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
function zafarbuvaty(){ if(!map.getSource('k-hex-L')) return;
 for(const G of HEXG){map.getSource('k-hex-'+G.id).setData(hexData(G,false)); map.getSource('k-col-'+G.id).setData(hexData(G,true))}
 map.setPaintProperty('k-hexsel','line-color',cssv('--ink'));
 map.setPaintProperty('k-hexselh','line-color',cssv('--surface'));
 namalyuvaty()}
map.on('style.load',()=>{
 const layers=map.getStyle().layers;
 // Соти — над усіма лініями й заливками підкладки, під підписами (у dark перший підпис іде ще до доріг).
 const ostLiniya=layers.map(l=>l.type!=='symbol').lastIndexOf(true), nadSymbol=(layers[ostLiniya+1]||{}).id;
 // А: пласкі соти лежать під дорогами — вулиці читаються поверх даних.
 const pidDorogy=VAR==='a'?(layers.find(l=>l['source-layer']==='transportation')||{}).id:nadSymbol;
 const opProz={a:.85,b:.92,v:.9}[VAR];
 for(const G of HEXG){const id=G.id, z=COL_ZUM[id];
  map.addSource('k-hex-'+id,{type:'geojson',data:hexData(G,false)});
  map.addSource('k-col-'+id,{type:'geojson',promoteId:'k',data:hexData(G,true)});
  map.addLayer({id:'k-hex-'+id,type:'fill',source:'k-hex-'+id,minzoom:z[0],maxzoom:z[1],paint:{'fill-color':['get','c'],'fill-opacity':proz2d(id)}},pidDorogy);
  map.addLayer({id:'k-hexl-'+id,type:'line',source:'k-hex-'+id,minzoom:z[0],maxzoom:z[1],paint:{'line-color':['get','c'],'line-width':.8,'line-opacity':['*',.5,['get','a']]}},pidDorogy);
  const ext=(lid,filter,minzoom)=>map.addLayer({id:lid,type:'fill-extrusion',source:'k-col-'+id,filter,minzoom,maxzoom:z[1],paint:{
   'fill-extrusion-color':['case',['boolean',['feature-state','sel'],false],['get','cl'],['get','c']],
   'fill-extrusion-base':vysota(id,'bh','eb'),'fill-extrusion-height':vysota(id,'h','eh'),'fill-extrusion-opacity':opProz,'fill-extrusion-vertical-gradient':true}},nadSymbol);
  ext('k-col-'+id,['!=',['get','slab'],1],z[0]);
  // нижній клас 330 м у 3D — окремий шар, з'являється лише з наближенням
  ext('k-col-slab-'+id,['==',['get','slab'],1],id==='L'?ZUM_SLABKYKH:z[0])}
 // М'яке світло, прив'язане до карти, щоб не «їздило» з камерою; у Б — м'якше й вище.
 map.setLight({anchor:'map',position:VAR==='b'?[1.4,200,35]:[1.2,210,40],intensity:VAR==='b'?.35:.45,color:'#ffffff'});
 map.addSource('k-hexsel',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'k-hexselh',type:'line',source:'k-hexsel',paint:{'line-color':'#fff','line-width':5}});
 map.addLayer({id:'k-hexsel',type:'line',source:'k-hexsel',paint:{'line-color':'#1B1F24','line-width':2.5}});
 zafarbuvaty(); pidpysZumu(); zastosuvatyRist();
 if(ZARAZ) vydilyty(ZARAZ.G,ZARAZ.b)});

// При відкритті — увесь Київ (якщо в адресі ще немає камери).
map.once('load',()=>{
 if(!maHesh){let w=180,s=90,e=-180,n=-90;
  for(const c of HEXB.L.values()){const lo=c.cx/MX_,la=c.cy/MY_; if(lo<w)w=lo; if(lo>e)e=lo; if(la<s)s=la; if(la>n)n=la}
  const pad=telefon()?{top:130,bottom:90,left:0,right:0}:{top:140,bottom:72,left:48,right:48};
  let cam=null; try{cam=map.cameraForBounds([[w,s],[e,n]],{padding:pad})}catch(e){}
  // На телефоні місто трохи обрізане з боків, зате соти більші (≥ 15 px на першому екрані).
  if(cam) map.jumpTo({center:cam.center,zoom:cam.zoom+(telefon()?.55:MODE==='stovp'?.4:0),pitch:MODE==='stovp'?45:0})}
 vyrosty()});

// ---- 2D/3D ----
function d3Tekst(){const b=$('#f3d'); b.textContent=MODE==='stovp'?'2D':'3D'; b.setAttribute('aria-pressed',String(MODE==='stovp'))}
$('#f3d').onclick=()=>{MODE=MODE==='stovp'?'soty':'stovp'; zakryty(); namalyuvaty(); d3Tekst(); namalyuvatyLehendu();
 map.easeTo({pitch:MODE==='stovp'?pitch3d():0,duration:TYKHO?0:500})};
d3Tekst();
map.on('zoomend',()=>{if(ZARAZ&&ZARAZ.G.id!==colG()) zakryty();
 if(MODE==='stovp'&&!map.isMoving()&&Math.abs(map.getPitch()-pitch3d())>2) map.easeTo({pitch:pitch3d(),duration:TYKHO?0:300})});
function pidpysZumu(){$('#tykha').hidden=map.getZoom()<ZUM_BUDYNKIV}
map.on('zoom',pidpysZumu);

// ---- Легенда й фільтр видів ----
function namalyuvatyLehendu(){const id=colG(), p=POR[id];
 $('#lehenda ul').innerHTML=HRUPY.map((h,i)=>`<li><button type="button" data-g="${i}" aria-pressed="${AKTYVNI.has(i)}">${esc(h[1])}</button></li>`).join('');
 const mezhi=[1,...p];
 $('.shkala').innerHTML=`<div class="ryad"><span>менше</span><span class="zr" title="Від скількох подій у соті починається крок">${SHKALA[TEMA].map((c,i)=>`<span class="kl"><i style="background:${c}"></i><small>${fmt(mezhi[i])}+</small></span>`).join('')}</span><span>більше подій<br>у даних</span></div>`
  +(MODE==='stovp'?'<div class="vyshche">вище й темніше — те саме число подій</div>':'')}
namalyuvatyLehendu();
map.on('zoomend',()=>namalyuvatyLehendu());
function pislyaFiltra(){pererakhuvaty(); zafarbuvaty(); namalyuvatyLehendu();
 if(ZARAZ){if(ZARAZ.b.nf>0) namalyuvatyKartku(); else zakryty()}}
$('#lehenda').addEventListener('click',e=>{
 if(e.target.closest('#hr-vidkr')){const v=$('#lehenda').classList.toggle('vidkr'); $('#hr-vidkr').setAttribute('aria-expanded',String(v)); return}
 const b=e.target.closest('[data-g]'); if(!b) return; const i=+b.dataset.g;
 if(AKTYVNI.has(i)){if(AKTYVNI.size>1) AKTYVNI.delete(i)} else AKTYVNI.add(i);
 pislyaFiltra()});
const IK=b=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const SONTSE=IK('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const MISYATS=IK('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>');
function knopkaTemy(){const b=$('#ftema'), tem=TEMA==='temna', t=tem?'Увімкнути світлу тему':'Увімкнути темну тему';
 b.innerHTML=tem?SONTSE:MISYATS; b.setAttribute('aria-label',t); b.title=t}
function postavytyTemu(t){if(!SHKALA[t]||t===TEMA) return; TEMA=t;
 const p=new URLSearchParams(location.search); p.set('tema',t); history.replaceState(null,'',location.pathname+'?'+p+location.hash);
 document.body.dataset.t=t; knopkaTemy(); namalyuvatyLehendu(); postavytyStyl();
 if(ZARAZ) namalyuvatyKartku()}
$('#ftema').onclick=()=>postavytyTemu(TEMA==='temna'?'svitla':'temna');
knopkaTemy();
MAKET.tema=postavytyTemu;

// ---- Пошук: назви місць і районів із даних (без геокодера; справжні адреси — у підписці) ----
const MISTSIA=[];
{const kr=new Map();
 for(const b of HEXB.S.values()) if(b.oriyentyr){const s=kr.get(b.oriyentyr); if(!s||b.n>s.b.n) kr.set(b.oriyentyr,{b,rayon:b.rayon})}
 for(const [nazva,{b,rayon}] of kr) MISTSIA.push({nazva,dod:rayon?rayon+' район':'',G:HEXG[1],b});
 const ry=new Map(); for(const b of HEXB.L.values()) if(b.rayon){const s=ry.get(b.rayon)||{w:180,s:90,e:-180,n:-90};
  const lo=b.cx/MX_,la=b.cy/MY_; s.w=Math.min(s.w,lo); s.e=Math.max(s.e,lo); s.s=Math.min(s.s,la); s.n=Math.max(s.n,la); ry.set(b.rayon,s)}
 for(const [r,m] of ry) MISTSIA.push({nazva:r+' район',dod:'район',mezhi:[[m.w,m.s],[m.e,m.n]]})}
const norm=s=>s.toLowerCase().replace(/[’'ʼ`]/g,"'").replace(/ё/g,'е');
let PIDK=[], VYBR=-1;
function pokazatyPidkazky(){const q=norm($('#poshuk').value.trim()), ul=$('#pidkazky');
 if(q.length<2){ul.hidden=true; PIDK=[]; return}
 const maks=telefon()?6:8;
 PIDK=MISTSIA.map(m=>{const n=norm(m.nazva), i=n.indexOf(q); return i<0?null:{m,i,poch:i===0||n[i-1]===' '?0:1}}).filter(Boolean)
  .sort((a,b)=>a.poch-b.poch||(a.m.mezhi?-1:0)-(b.m.mezhi?-1:0)||a.m.nazva.length-b.m.nazva.length).slice(0,maks);
 VYBR=-1;
 // Дописане жирним, набране — звичайним (Baymard).
 ul.innerHTML=PIDK.length?PIDK.map(({m,i},j)=>{const t=m.nazva, l=q.length;
  return `<li role="option" id="pk${j}" data-j="${j}" aria-selected="false"><span><b>${esc(t.slice(0,i))}</b>${esc(t.slice(i,i+l))}<b>${esc(t.slice(i+l))}</b></span><small>${esc(m.dod)}</small></li>`}).join('')
  :'<li class="porozh">Такої назви немає в даних макета</li>';
 ul.hidden=false}
function vybraty(j){const p=PIDK[j]; if(!p) return; const m=p.m; $('#pidkazky').hidden=true; $('#poshuk').value=m.nazva; $('#poshuk').blur();
 document.body.classList.remove('shukayu'); zakryty();
 if(m.mezhi){map.fitBounds(m.mezhi,{padding:telefon()?{top:140,bottom:120,left:20,right:20}:{top:160,bottom:80,left:80,right:80},pitch:MODE==='stovp'?45:0,duration:TYKHO?0:1000}); return}
 // Камера сама летить до місця й відкриває картку соти (Berliner Morgenpost).
 const z=13.4; map.flyTo({center:[m.b.cx/MX_,m.b.cy/MY_],zoom:z,pitch:MODE==='stovp'?pitch3d(z):0,duration:TYKHO?0:1200,essential:true});
 map.once('moveend',()=>{const b=HEXB.S.get(m.b.k); if(b&&b.nf>0) vidkryty(HEXG[1],b)})}
$('#poshuk').addEventListener('input',pokazatyPidkazky);
$('#poshuk').addEventListener('focus',()=>{document.body.classList.add('shukayu'); zakryty(); pokazatyPidkazky()});
$('#poshuk').addEventListener('blur',()=>setTimeout(()=>{document.body.classList.remove('shukayu'); $('#pidkazky').hidden=true},150));
$('#poshuk').addEventListener('keydown',e=>{const n=PIDK.length;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!n) return; e.preventDefault(); VYBR=(VYBR+(e.key==='ArrowDown'?1:-1)+n)%n;
  document.querySelectorAll('#pidkazky li').forEach((li,j)=>li.setAttribute('aria-selected',String(j===VYBR)));
  $('#poshuk').setAttribute('aria-activedescendant','pk'+VYBR)}
 else if(e.key==='Enter'){e.preventDefault(); vybraty(VYBR>=0?VYBR:0)}
 else if(e.key==='Escape'){$('#pidkazky').hidden=true}});
$('#pidkazky').addEventListener('pointerdown',e=>{const li=e.target.closest('[data-j]'); if(li){e.preventDefault(); vybraty(+li.dataset.j)}});
MAKET.poshuk=t=>{$('#poshuk').value=t; pokazatyPidkazky(); return PIDK.map(p=>p.m.nazva)};
MAKET.vybraty=vybraty;

// ---- Картка соти за MV-32 (як у М3) ----
const ZAMOK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const koma=x=>String(x).replace('.',',');
function porivnyannya(n,G){const baza=MEDIANA*(G.R/130)**2, r=n/baza;
 const de=G.id==='L'?'ніж на такій самій площі в типовій соті Києва':'ніж у типовій соті Києва';
 if(r>=.9&&r<=1.1) return G.id==='L'?'приблизно як на такій самій площі в типовій соті Києва':'приблизно як у типовій соті Києва';
 const bilshe=r>1, x=bilshe?r:1/r, ok=x<10?Math.round(x*10)/10:Math.round(x), cile=Number.isInteger(ok);
 const slovo=!cile?'раза':pl(ok,'раз','рази','разів');
 return `у ${koma(ok)} ${slovo} ${bilshe?'більше':'менше'}, ${de}`}
const pidp=y=>'’'+String(y).slice(2);
function stovpchyky(b){const r=D.meta.roky, st=D.meta.stari, mx=Math.max(1,...b.y), H=36;
 const vilni=r.map((y,i)=>{const v=b.y[i], h=v?Math.max(4,Math.round(H*v/mx)):2;
  return `<div class="r${y===D.meta.nepovnyi?' nepovnyi':''}"><em>${fmt(v)}</em><u style="height:${h}px;${v?'':'background:var(--line-strong)'}"></u><span>${pidp(y)}</span></div>`}).join('');
 const star=st.map(y=>`<div class="r zamok">${ZAMOK}<u style="height:18px"></u><span>${pidp(y)}</span></div>`).join('');
 return `<div class="roky">${star}${vilni}</div><p class="pidpys-sir">${st[0]}–${st[st.length-1]} — у підписці · ${D.meta.nepovnyi} — неповний рік</p>`}
function namalyuvatyKartku(){const {G,b}=ZARAZ, el=$('#kartka'), m=D.meta, n=b.nf, filtr=AKTYVNI.size<GN;
 const rn=b.rayon?b.rayon+' район':'', nazva=b.oriyentyr||rn||'Київ', rayon=b.oriyentyr?rn:'';
 const dop=filtr?' · усі групи':'';
 let tilo;
 if(n<5){
  tilo=`<div class="malo"><b>Мало даних</b><span>Менше 5 подій за ${esc(m.period)}</span></div>`;
 }else{
  const NAS=HRUPY.findIndex(h=>h[0]==='nas');
  const top=b.gf.map((v,i)=>[v,i]).filter(x=>x[1]!==NAS&&x[0]>0).sort((x,y)=>y[0]-x[0]).slice(0,3);
  const ryadky=top.map(([v,i])=>`<div class="hr"><span>${esc(HRUPY[i][1])}</span><b>${fmt(v)}</b></div>`).join('');
  const nas=b.gf[NAS]>0?`<div class="nas"><span>Насильство</span><b>${fmt(b.gf[NAS])}</b></div>`:'';
  const pik=b.chasN>=5
   ?`<div class="pik"><b>${String(b.pik).padStart(2,'0')}:00–${String((b.pik+1)%24).padStart(2,'0')}:00</b><span>${fmt(b.pikN)} з ${fmt(b.chasN)} ${pl(b.chasN,'події','подій','подій')}, де суд указав час</span></div>`
   :`<div class="pik"><span>Мало даних про час</span></div>`;
  const povt=b.pr.length?`<section class="blok"><h3>Повторюється тут</h3><ul class="povt">${b.pr.map(i=>`<li>${esc(D.problemy[i])}</li>`).join('')}</ul></section>`:'';
  tilo=`<div class="chyslo"><div class="velyke">${fmt(n)}</div><div class="pid">${pl(n,'подія','події','подій')} за ${esc(m.period)}</div></div>
   <p class="por">${porivnyannya(n,G)}</p>
   <section class="blok"><h3>Найбільше тут</h3>${ryadky}${nas}</section>
   <section class="blok"><h3>За роками${dop}</h3>${stovpchyky(b)}</section>
   <section class="blok"><h3>Година-пік${dop}</h3>${pik}</section>${povt}`;
 }
 el.innerHTML=`<div class="k-ruchka"></div><div class="k-shap"><div><h2>${esc(nazva)}</h2>${rayon?`<p>${esc(rayon)}</p>`:''}</div><button class="k-x" type="button" aria-label="Закрити">×</button></div>${tilo}
  <p class="mezha">Лише те, що дійшло до суду. Пробний випуск даних.</p>`;
}
function zakryty(){ if(!ZARAZ) return;
 if(map.getSource('k-col-'+ZARAZ.G.id)) map.setFeatureState({source:'k-col-'+ZARAZ.G.id,id:ZARAZ.b.k},{sel:false});
 if(map.getSource('k-hexsel')) map.getSource('k-hexsel').setData({type:'FeatureCollection',features:[]});
 ZARAZ=null; const el=$('#kartka'); el.hidden=true; el.classList.remove('vysoka'); document.body.classList.remove('k-vidkr')}
function vydilyty(G,b){ if(!map.getSource('k-hexsel')) return;
 map.setFeatureState({source:'k-col-'+G.id,id:b.k},{sel:true});
 map.getSource('k-hexsel').setData({type:'Feature',geometry:{type:'LineString',coordinates:hexPoly(b.cx,b.cy,G.R,KLITYNKA)[0]}})}
function zPidKartky(G,b){const el=$('#kartka'), m=map.getContainer().getBoundingClientRect(), k=el.getBoundingClientRect(), ZAZOR=16;
 const v=hexPoly(b.cx,b.cy,G.R,1)[0].map(p=>map.project(p)), xs=v.map(q=>q.x), ys=v.map(q=>q.y);
 let A_,B_;
 if(telefon()){const verh=k.top-m.top, nyz=Math.max(...ys); if(nyz<=verh) return;
  const x=(Math.min(...xs)+Math.max(...xs))/2; A_=[x,nyz]; B_=[x,verh-ZAZOR]}
 else{const prav=k.right-m.left, liv=Math.min(...xs), y=(Math.min(...ys)+Math.max(...ys))/2;
  if(liv>=prav||Math.min(...ys)>=k.bottom-m.top||Math.max(...ys)<=k.top-m.top) return;
  A_=[liv,y]; B_=[prav+ZAZOR,y]}
 const a=map.unproject(A_), c=map.unproject(B_), o=map.getCenter();
 map.easeTo({center:[o.lng+a.lng-c.lng,o.lat+a.lat-c.lat],duration:TYKHO?0:500,essential:true})}
function vidkryty(G,b){zakryty(); ZARAZ={G,b};
 const el=$('#kartka'); el.hidden=false; el.scrollTop=0; document.body.classList.add('k-vidkr'); namalyuvatyKartku();
 vydilyty(G,b); zPidKartky(G,b)}
MAKET.vidkryty=(id,k)=>vidkryty(HEXG.find(G=>G.id===id),HEXB[id].get(k));
MAKET.zakryty=zakryty;
{const el=$('#kartka'); let st=null;
 el.addEventListener('pointerdown',e=>{if(!telefon()||e.target.closest('.k-x')||!e.target.closest('.k-ruchka,.k-shap')) return;
  st={y:e.clientY,h:el.offsetHeight,rukh:false}; el.setPointerCapture(e.pointerId); el.classList.add('tyagnu')});
 el.addEventListener('pointermove',e=>{if(!st) return; const dy=st.y-e.clientY; if(Math.abs(dy)>4) st.rukh=true;
  if(st.rukh) el.style.height=Math.min(innerHeight-8,Math.max(innerHeight*.5,st.h+dy))+'px'});
 const kin=()=>{if(!st) return; const vys=st.rukh?el.offsetHeight>innerHeight*.75:!el.classList.contains('vysoka');
  st=null; el.classList.remove('tyagnu'); el.style.height=''; el.classList.toggle('vysoka',vys)};
 el.addEventListener('pointerup',kin); el.addEventListener('pointercancel',kin)}
$('#kartka').addEventListener('click',e=>{if(e.target.closest('.k-x')) zakryty()});
addEventListener('keydown',e=>{if(e.key==='Escape') zakryty()});

// ---- Клік: у 3D — найближчий до камери стовпчик під пальцем; повз стовпчики — сота на землі під точкою ----
function zoLayers(){return HEXG.flatMap(G=>MODE==='soty'?['k-hex-'+G.id]:['k-col-'+G.id,'k-col-slab-'+G.id]).filter(id=>map.getLayer(id)&&map.getLayoutProperty(id,'visibility')!=='none')}
function zKlyucha(x){const G=HEXG.find(g=>x.layer.id.endsWith('-'+g.id)), b=G&&HEXB[G.id].get(x.properties.k); return b&&b.nf?{G,b}:null}
function naZemli(p){const id=colG(), G=HEXG.find(g=>g.id===id), ll=map.unproject([p.x,p.y]), x=ll.lng*MX_, y=ll.lat*MY_;
 let best=null,bd=(G.R*1.05)**2;
 for(const b of HEXB[id].values()){if(!b.nf) continue; const d=(b.cx-x)**2+(b.cy-y)**2; if(d<bd){bd=d;best={G,b}}}
 return best}
function vluchannya(p0,dotyk){const shary=zoLayers(); if(!shary.length) return null; const p={x:p0.x,y:p0.y};
 // точка: MapLibre повертає стовпчики від найближчого до камери
 const f=map.queryRenderedFeatures([p.x,p.y],{layers:shary}).map(zKlyucha).filter(Boolean).filter(h=>h.G.id===colG());
 if(f.length) return f[0];
 if(dotyk){const r=16, ff=map.queryRenderedFeatures([[p.x-r,p.y-r],[p.x+r,p.y+r]],{layers:shary}).map(zKlyucha).filter(Boolean);
  let best=null,bd=1e30;
  for(const h of ff){const q=map.project([h.b.cx/MX_,h.b.cy/MY_]), d=(q.x-p.x)**2+(q.y-p.y)**2; if(d<bd){bd=d;best=h}}
  if(best) return best}
 return naZemli(p)}
MAKET.vluchannya=vluchannya;
let tPidk=0;
function pidkazka(t){const el=$('#pidkazka'); el.textContent=t; el.classList.add('vyd'); clearTimeout(tPidk); tPidk=setTimeout(()=>el.classList.remove('vyd'),1400)}
function khvylya(p){if(TYKHO) return; const d=document.createElement('div'); d.className='khvylya'; d.style.left=p.x+'px'; d.style.top=p.y+'px';
 document.body.appendChild(d); setTimeout(()=>d.remove(),350)}
const TIP=new maplibregl.Popup({closeButton:false,closeOnClick:false,className:'k-tip',offset:14,maxWidth:'320px'});
map.on('click',e=>{const h=vluchannya(e.point,telefon()); khvylya(e.point);
 if(h){TIP.remove(); vidkryty(h.G,h.b)} else {zakryty(); pidkazka('Тут немає подій у даних')}});
map.on('mousemove',e=>{ if(telefon()) return; const h=vluchannya(e.point,false);
 map.getCanvas().style.cursor=h?'pointer':'';
 if(!h) return TIP.remove();
 const t=h.b.nf<5?'Мало даних':`${fmt(h.b.nf)} ${pl(h.b.nf,'подія','події','подій')}`;
 TIP.setLngLat(e.lngLat).setHTML(`<b>${t}</b>`).addTo(map)});
map.on('mouseout',()=>TIP.remove());
</script>
