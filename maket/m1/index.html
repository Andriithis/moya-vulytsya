  const q=map.project([b.cx/MX_,b.cy/MY_]), d=(q.x-p.x)**2+(q.y-p.y)**2; if(d<bd){bd=d;best={G,b}}}
 return best}

 TIP.setLngLat(e.lngLat).setHTML(`<b>${t}</b>`).addTo(map)});
