function layerVis(id,on){if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',on?'visible':'none')}
function namalyuvaty(){for(const G of HEXG){
 layerVis('k-hex-'+G.id,MODE==='soty'); layerVis('k-hexl-'+G.id,MODE==='soty'); layerVis('k-col-'+G.id,MODE==='stovp')}}
map.on('style.load',()=>{
 const before=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
 for(const G of HEXG){const id=G.id;
  map.addSource('k-hex-'+id,{type:'geojson',data:hexData(G,false)});
  map.addSource('k-col-'+id,{type:'geojson',promoteId:'k',data:hexData(G,true)});
  map.addLayer({id:'k-hex-'+id,type:'fill',source:'k-hex-'+id,paint:{'fill-color':['get','c'],'fill-opacity':fadeBy(id,['get','a'])}},before);
  map.addLayer({id:'k-hexl-'+id,type:'line',source:'k-hex-'+id,paint:{'line-color':'rgba(255,255,255,.4)','line-width':.6,'line-opacity':fadeBy(id,1)}},before);
  map.addLayer({id:'k-col-'+id,type:'fill-extrusion',source:'k-col-'+id,minzoom:COL_ZUM[id][0],maxzoom:COL_ZUM[id][1],paint:{
   'fill-extrusion-color':['case',['boolean',['feature-state','sel'],false],['get','cl'],['get','c']],
   'fill-extrusion-height':colVysota(id),'fill-extrusion-opacity':.55}})}
 map.addSource('k-hexsel',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'k-hexselh',type:'line',source:'k-hexsel',paint:{'line-color':'#fff','line-width':5}});
 map.addLayer({id:'k-hexsel',type:'line',source:'k-hexsel',paint:{'line-color':'#1B1F24','line-width':2.5}});
 namalyuvaty(); pidpysZumu()});

// S-К.23: при відкритті — увесь Київ.
map.once('load',()=>{let w=180,s=90,e=-180,n=-90;
 for(const c of HEXB.L.values()){const lo=c.cx/MX_,la=c.cy/MY_; if(lo<w)w=lo; if(lo>e)e=lo; if(la<s)s=la; if(la>n)n=la}
 const b=[[w,s],[e,n]], pad=telefon()?{top:96,bottom:96,left:16,right:16}:{top:96,bottom:64,left:48,right:48};
 let cam=null; try{cam=map.cameraForBounds(b,{padding:pad})}catch(e){}
 // На нахилі 45° висота міста стискається приблизно на 0,7, тож на широкому екрані є запас для наближення.
 if(cam) map.jumpTo({center:cam.center,zoom:cam.zoom+(telefon()?0:.45),pitch:45})});

// ---- Кнопка 3D/2D (S-К.4) ----
function d3Tekst(){const b=$('#f3d'); b.textContent=MODE==='stovp'?'2D':'3D'; b.setAttribute('aria-pressed',String(MODE==='stovp'))}
$('#f3d').onclick=()=>{MODE=MODE==='stovp'?'soty':'stovp'; zakryty(); namalyuvaty(); d3Tekst();
 map.easeTo({pitch:MODE==='stovp'?pitch3d():0,duration:TYKHO?0:700})};
d3Tekst();
map.on('zoomend',()=>{if(ZARAZ&&ZARAZ.G.id!==colG()) zakryty();
 if(MODE==='stovp'&&!map.isMoving()&&Math.abs(map.getPitch()-pitch3d())>2) map.easeTo({pitch:pitch3d(),duration:TYKHO?0:400})});
function pidpysZumu(){$('#tykha').hidden=map.getZoom()<ZUM_BUDYNKIV}
map.on('zoom',pidpysZumu);

// ---- Легенда (S-К.6): ті самі 7 груп і кольори ----
$('#lehenda ul').innerHTML=HRUPY.map(h=>`<li><span class="krap" style="background:${h[2]}"></span>${esc(h[1])}</li>`).join('');

// ---- Варіанти старших років — вибір Андрія (MV-32) ----
let V=new URLSearchParams(location.search).get('v')==='b'?'b':'a';
function varianty(){document.querySelectorAll('.seg [data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===V)));
 if(ZARAZ) namalyuvatyKartku()}
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b){V=b.dataset.v; varianty()}});
varianty();

// ---- Картка соти за MV-32 ----
const ZAMOK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const koma=x=>String(x).replace('.',',');
// База — медіана сот 130 м (MV-36). Сота 330 м більша за площею, тож база для неї множиться на різницю площ.
function porivnyannya(n,G){const baza=D.meta.mediana130*(G.R/130)**2, r=n/baza;
 const de=G.id==='L'?'ніж на такій самій площі в типовій соті Києва':'ніж у типовій соті Києва';
 if(r>=.9&&r<=1.1) return G.id==='L'?'приблизно як на такій самій площі в типовій соті Києва':'приблизно як у типовій соті Києва';
 const bilshe=r>1, x=bilshe?r:1/r, ok=x<10?Math.round(x*10)/10:Math.round(x), cile=Number.isInteger(ok);
 const slovo=!cile?'раза':pl(ok,'раз','рази','разів');
 return `у ${koma(ok)} ${slovo} ${bilshe?'більше':'менше'}, ${de}`}
function stovpchyky(b){const r=D.meta.roky, mx=Math.max(1,...b.y), H=70;
 const vilni=r.map((y,i)=>{const v=b.y[i], h=v?Math.max(4,Math.round(H*v/mx)):2;
  return `<div class="r"><em>${fmt(v)}</em><u style="height:${h}px;${v?'':'background:var(--line-strong)'}"></u><span>${y}</span></div>`}).join('');
 if(V==='a'){const star=D.meta.stari.map(y=>`<div class="r zamok">${ZAMOK}<u style="height:34px"></u><span>${y}</span></div>`).join('');
  return `<div class="roky">${star}${vilni}</div><p class="pidpys-sir">${D.meta.stari[0]}–${D.meta.stari[D.meta.stari.length-1]} — у підписці</p>`}
 return `<div class="roky">${vilni}</div><div class="zamok-ryadok">${ZAMOK}<span>ще ${D.meta.stari.length} років історії — у підписці</span></div>`}
function namalyuvatyKartku(){const {G,b}=ZARAZ, el=$('#kartka'), m=D.meta;
 const rn=b.rayon?b.rayon+' район':'', nazva=b.oriyentyr||rn||'Київ', rayon=b.oriyentyr?rn:'';
 let tilo;
 if(b.n<5){
  tilo=`<div class="malo"><b>Мало даних</b><span>Менше 5 подій за ${esc(m.period)}</span></div>`;
 }else{
  const NAS=HRUPY.findIndex(h=>h[0]==='nas');
  const top=b.g.map((v,i)=>[v,i]).filter(x=>x[1]!==NAS&&x[0]>0).sort((x,y)=>y[0]-x[0]).slice(0,3);
  const ryadky=top.map(([v,i])=>`<div class="hr"><span class="krap" style="background:${HRUPY[i][2]}"></span><span>${esc(HRUPY[i][1])}</span><b>${fmt(v)}</b><i style="width:${Math.max(2,Math.round(100*v/b.n))}%;background:${HRUPY[i][2]}"></i></div>`).join('');
  const nas=b.g[NAS]>0?`<div class="nas"><span>Насильство</span><b>${fmt(b.g[NAS])}</b></div>`:'';
  const pik=b.chasN>=5
   ?`<div class="pik"><b>${String(b.pik).padStart(2,'0')}:00–${String((b.pik+1)%24).padStart(2,'0')}:00</b><span>${fmt(b.pikN)} з ${fmt(b.chasN)} ${pl(b.chasN,'події','подій','подій')}, де суд указав час</span></div>`
   :`<div class="pik"><span>Мало даних про час</span></div>`;
  const povt=b.pr.length?`<section class="blok"><h3>Повторюється тут</h3><ul class="povt">${b.pr.map(i=>`<li>${esc(D.problemy[i])}</li>`).join('')}</ul></section>`:'';
  tilo=`<div class="velyke">${fmt(b.n)}</div><div class="pid">${pl(b.n,'подія','події','подій')} за ${esc(m.period)}</div>
   <p class="por">${porivnyannya(b.n,G)}</p>
   <section class="blok"><h3>Найбільше тут</h3>${ryadky}${nas}</section>
   <section class="blok"><h3>За роками</h3>${stovpchyky(b)}</section>
   <section class="blok"><h3>Година-пік</h3>${pik}</section>${povt}`;
 }
 el.innerHTML=`<div class="k-shap"><div><h2>${esc(nazva)}</h2>${rayon?`<p>${esc(rayon)}</p>`:''}</div><button class="k-x" type="button" aria-label="Закрити">×</button></div>${tilo}
  <p class="mezha">Лише те, що дійшло до суду. Пробний випуск даних.</p>`;
}
function zakryty(){ if(!ZARAZ) return;
 map.setFeatureState({source:'k-col-'+ZARAZ.G.id,id:ZARAZ.b.k},{sel:false});
 map.getSource('k-hexsel').setData({type:'FeatureCollection',features:[]});
 ZARAZ=null; const el=$('#kartka'); el.hidden=true; el.classList.remove('vysoka'); document.body.classList.remove('k-vidkr')}
function vidkryty(G,b,polit=true){zakryty(); ZARAZ={G,b};
 const el=$('#kartka'); el.hidden=false; el.scrollTop=0; document.body.classList.add('k-vidkr'); namalyuvatyKartku();
 map.setFeatureState({source:'k-col-'+G.id,id:b.k},{sel:true});
 map.getSource('k-hexsel').setData({type:'Feature',geometry:{type:'LineString',coordinates:hexPoly(b.cx,b.cy,G.R,1)[0]}});
 if(!polit) return;
 // S-К.18, S-К.21: сота не під карткою — збоку на ПК, над шторкою на телефоні.
 // Переліт лишається в межах зуму цієї соти: 330 м не ближче за поріг, де з'являються 130 м.
 const z0=map.getZoom(), zz=G.id==='L'?Math.min(POROH-.4,Math.max(z0,11.7)):Math.max(z0,14);
 const zsuv=telefon()?[0,-Math.round(innerHeight*.25)]:[Math.round((el.offsetWidth+12)/2),0];
 map.flyTo({center:[b.cx/MX_,b.cy/MY_],zoom:zz,pitch:MODE==='stovp'?pitch3d(zz):0,offset:zsuv,duration:TYKHO?0:LIT_MS,curve:DUHA,essential:true})}
MAKET.vidkryty=(id,k,polit)=>vidkryty(HEXG.find(G=>G.id===id),HEXB[id].get(k),polit);
MAKET.zakryty=zakryty;
$('#kartka').addEventListener('click',e=>{
 if(e.target.closest('.k-x')) return zakryty();
 if(telefon()&&e.target.closest('.k-shap')) $('#kartka').classList.toggle('vysoka')});
addEventListener('keydown',e=>{if(e.key==='Escape') zakryty()});

// ---- Клік і наведення; дотик — найближче в 20 px (S-К.21) ----
function zoLayers(){return HEXG.map(G=>(MODE==='soty'?'k-hex-':'k-col-')+G.id).filter(id=>map.getLayer(id))}
function vluchannya(p,dotyk){const r=dotyk?20:0, bb=r?[[p.x-r,p.y-r],[p.x+r,p.y+r]]:p;
 const f=map.queryRenderedFeatures(bb,{layers:zoLayers()}); if(!f.length) return null;
 const id=colG(), sv=f.filter(x=>x.layer.id.endsWith('-'+id)), mn=sv.length?sv:f;
 let best=null,bd=1e30;
 for(const x of mn){const G=HEXG.find(g=>x.layer.id.endsWith('-'+g.id)), b=HEXB[G.id].get(x.properties.k); if(!b) continue;
  const q=map.project([b.cx/MX_,b.cy/MY_]), d=(q.x-p.x)**2+(q.y-p.y)**2; if(d<bd){bd=d;best={G,b}}}
 return best}
const TIP=new maplibregl.Popup({closeButton:false,closeOnClick:false,className:'k-tip',offset:14,maxWidth:'320px'});
map.on('click',e=>{const h=vluchannya(e.point,telefon()); if(h){TIP.remove(); vidkryty(h.G,h.b)} else zakryty()});
map.on('mousemove',e=>{ if(telefon()) return; const h=vluchannya(e.point,false);
 map.getCanvas().style.cursor=h?'pointer':'';
 if(!h) return TIP.remove();
 const t=h.b.n<5?'Мало даних':`${fmt(h.b.n)} ${pl(h.b.n,'подія','події','подій')} · ${esc(HRUPY[h.b.gi][1])}`;
 TIP.setLngLat(e.lngLat).setHTML(`<b>${t}</b>`).addTo(map)});
map.on('mouseout',()=>TIP.remove());
</script>
</body>
</html>
