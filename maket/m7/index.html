<style>
/* М7 (ZAVDANNYA-42, етап А): механіка К3 з М6 (шкала частками, вершини, плавний зум) + напрями кольору й відгук на дотик.
   Колір = скільки подій у даних, не небезпека: жодного червоного чи помаранчевого. Кольори напрямів — napryamy.json (OKLCH).
   «Іграшковий» матеріал: плашки й кнопки — як клавіші (суцільний бортик знизу, без розмиття), натиск опускає клавішу. */
/* Шрифт — IBM Plex Sans (IBM, SIL OFL 1.1), файли з @fontsource 5.3.0 (maket/m6/shryfty, ліцензія поруч). */
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Plex;font-weight:700 800;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Plex;font-weight:700 800;font-display:swap;src:url(../m6/shryfty/ibm-plex-sans-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
/* --mezha: межі плашок і кнопок — ≥ 3:1 до тла, поверхні, парку й води (як у М5). */
:root{--ground:#F7F6F2;--surface:#FFFFFF;--surface-tint:#F1F7F6;--ink:#1B1F24;--ink-2:#3D434C;--muted:#5B616B;
 --line:#E3E1DA;--line-strong:#C9C6BD;--mezha:#7F7C75;--accent:#0B6B6B;--accent-soft:#D7EBEA;--on-accent:#FFFFFF;
 --data-city:#A9ADB4;--data-3:#068784;--bort:#7F7C75;
 --radius-s:6px;--radius-m:12px;--radius-l:16px;--radius-pill:999px;
 --disp:Plex,system-ui,sans-serif;--sans:Plex,system-ui,sans-serif;--shyryna:320px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:400 15px/22px var(--sans)}
#map{position:fixed;inset:0;background:var(--ground)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
/* Кольори теми й напряму сторінка ставить сама з napryamy.json (змінні вище — запасні). */
body[data-t=temna] .maplibregl-ctrl-group{background:var(--surface)}
body[data-t=temna] .maplibregl-ctrl-group button+button{border-top-color:var(--line)}
body[data-t=temna] .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-group{border:1.5px solid var(--mezha);box-shadow:0 3px 0 var(--bort)!important;border-radius:var(--radius-m)!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.plashka{position:absolute;z-index:5;background:var(--surface);border:1.5px solid var(--mezha);border-radius:var(--radius-m);box-shadow:0 3px 0 var(--bort)}
/* Клавіша: натиск опускає її на бортик (рух — лише якщо його не вимкнено). */
.klav{transition:transform .08s ease-out,box-shadow .08s ease-out}
.klav:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bort)}
body.tykho .klav{transition:none}
/* ---- Перемикачі макета (лише для вибору) ---- */
#porivn{bottom:12px;left:16px;display:flex;align-items:center;gap:8px;padding:4px 6px;z-index:7;max-width:calc(100vw - 24px)}
#porivn .gr{display:flex;align-items:center;gap:8px;flex:none}
#porivn .gr>span{font:600 12px/16px var(--sans);color:var(--muted);margin:0 2px 0 6px;white-space:nowrap}
#porivn button{min-width:34px;min-height:34px;padding:0 8px;border:0;border-radius:var(--radius-s);background:none;font:600 13px/18px var(--sans);color:var(--ink-2);white-space:nowrap}
#porivn button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
#porivn button i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
#porivn .mitka{font:600 12px/16px var(--sans);color:var(--ink);background:var(--accent-soft);padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap}
/* ---- Етап Б. Верх ліворуч: пошук і в тому ж рядку значки 2D/3D, день/ніч, ⓘ; під ними — фільтр подій.
   Праворуч — лише картка. Ніщо не рухається, коли картка відкривається чи закривається. ---- */
#verkh-ryad{position:absolute;z-index:6;left:16px;top:16px;display:flex;gap:8px;align-items:center}
#verkh{position:relative;left:auto;top:auto;display:flex;align-items:center;gap:10px;padding:0 4px 0 12px;width:300px;min-height:48px}
.znak{flex:none;display:flex}
#poshuk{flex:1;min-width:0;height:44px;border:0;background:none;font:400 16px/24px var(--sans);color:var(--ink);outline:none}
#poshuk::placeholder{color:var(--muted)}
.znachok{flex:none;width:46px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:var(--radius-m);border:1.5px solid var(--mezha);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--bort);font:700 14px/20px var(--disp)}
.znachok[aria-expanded=true]{background:var(--accent-soft);border-color:var(--accent)}
.zn-v{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1}
.zn-v small{font:700 10px/12px var(--disp);letter-spacing:.3px}
#pidkazky{position:absolute;z-index:8;left:16px;top:76px;width:300px;margin:0;padding:4px;list-style:none}
#pidkazky[hidden]{display:none}
#pidkazky li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 10px;border-radius:var(--radius-s);font:400 16px/22px var(--sans);color:var(--ink-2);cursor:pointer}
#pidkazky li b{font-weight:600;color:var(--ink)}
#pidkazky li small{flex:none;font:400 13px/18px var(--sans);color:var(--muted)}
#pidkazky li[aria-selected=true]{background:var(--accent-soft)}
#pidkazky .porozh{color:var(--muted);cursor:default}
#tykha{position:absolute;z-index:4;left:50%;top:16px;transform:translateX(-50%);padding:4px 12px;border-radius:var(--radius-pill);
 background:var(--surface);border:1px solid var(--mezha);color:var(--muted);font:400 13px/18px var(--sans);white-space:nowrap;pointer-events:none}
#tykha[hidden],#kartka[hidden]{display:none}
/* ---- Фільтр подій: (1) одна кнопка «Усі події ▾» зі списком; (2) маленькі значки з підписами ---- */
#filtr{position:absolute;z-index:5;left:16px;top:76px}
#filtr[hidden]{display:none}
.f-knopka{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 10px;border-radius:var(--radius-pill);border:1.5px solid var(--mezha);background:var(--surface);box-shadow:0 3px 0 var(--bort);font:600 14px/20px var(--sans);color:var(--ink)}
.f-knopka svg{color:var(--accent)}
.f-spysok{position:absolute;left:0;top:48px;width:260px;margin:0;padding:6px;list-style:none;z-index:8}
.f-spysok[hidden]{display:none}
.f-spysok li label{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px;border-radius:var(--radius-s);font:400 14px/20px var(--sans);cursor:pointer}
.f-spysok li label:hover{background:var(--surface-tint)}
.f-spysok input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.f-spysok .f-usi{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:4px}
/* ---- ⓘ як читати карту ---- */
#info{position:absolute;z-index:8;left:16px;top:76px;width:400px;max-height:calc(100% - 92px);overflow-y:auto;padding:12px 14px;font:400 13px/18px var(--sans);color:var(--ink-2)}
#info[hidden]{display:none}
#info h2{margin:0 0 6px;font:700 16px/22px var(--disp);color:var(--ink)}
#info h3{margin:12px 0 4px;font:600 13px/18px var(--sans);color:var(--muted)}
#info p{margin:4px 0}
#info .i-x{float:right;width:40px;height:40px;margin:-8px -8px 0 0;border:0;background:none;font-size:22px;color:var(--muted)}
#info a{color:var(--ink-2)}
.shkala{margin-top:4px;font:400 13px/18px var(--sans);color:var(--muted)}
.shkala .ryad{display:flex;align-items:flex-start;gap:8px}
.shkala .ryad>span:not(.zr){white-space:nowrap}
.shkala .zr{display:flex;gap:3px}
.shkala .kl{display:flex;flex-direction:column;align-items:center;width:34px}
.shkala .kl i{display:block;width:30px;height:16px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.shkala .kl small{font:400 12px/16px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted)}
.shkala .vershyna{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2)}
.shkala .vershyna svg{flex:none}
/* ---- Відгук на дотик: натиск соти малює сама карта (обвідка «вдавлюється» й пружинить, вершина осідає) ---- */
#pidkazka{position:absolute;z-index:6;left:50%;bottom:84px;transform:translateX(-50%);padding:8px 14px;border-radius:var(--radius-pill);background:var(--ink);color:var(--ground);font:400 14px/20px var(--sans);pointer-events:none;opacity:0;transition:opacity .15s}
#pidkazka.vyd{opacity:1;transition-duration:.2s}
/* ---- Картка соти: на ПК — праворуч, під кнопками нічого не перекриває; на телефоні — шторка ---- */
#kartka{position:absolute;z-index:6;right:16px;top:16px;max-height:calc(100% - 64px);width:372px;padding:12px 16px;overflow-y:auto;overscroll-behavior:contain;border-radius:var(--radius-l)}
/* Картка з'являється м'яко: коротке проявлення й підйом на 8 px (на телефоні — шторка виїжджає знизу). */
#kartka.z{animation:kz .2s cubic-bezier(.2,.8,.3,1)}
@keyframes kz{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.k-ruchka{display:none}
.k-shap{display:flex;align-items:flex-start;gap:8px}
.k-shap>div{flex:1;min-width:0}
.k-shap h2{margin:0;font:700 18px/22px var(--disp)}
.k-shap p{margin:0;font:400 12px/16px var(--sans);color:var(--muted)}
.k-x{flex:none;width:44px;height:44px;margin:-8px -10px 0 0;border:0;background:none;font-size:24px;line-height:24px;color:var(--muted)}
.chyslo{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.velyke{font:800 34px/40px var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pid{font:600 13px/18px var(--sans);color:var(--ink-2)}
.por{margin:0;font:400 13px/18px var(--sans);color:var(--ink)}
.malo{margin-top:8px;padding:12px;background:var(--surface-tint);border-radius:var(--radius-m)}
.malo b{display:block;font:800 18px/24px var(--disp)}
.malo span{font:400 13px/18px var(--sans);color:var(--ink-2)}
.blok{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.blok h3{margin:0 0 4px;font:600 13px/18px var(--sans);color:var(--muted)}
.hr{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;min-height:22px;font:400 13px/18px var(--sans)}
.hr b{font:800 14px/18px var(--disp);font-variant-numeric:tabular-nums}
.nas{display:flex;justify-content:space-between;align-items:center;min-height:24px;margin-top:3px;padding-top:3px;font:400 13px/18px var(--sans);border-top:1px dashed var(--line);color:var(--ink-2)}
.nas b{font:800 14px/18px var(--disp);color:var(--ink)}
.roky{display:flex;align-items:flex-end;gap:3px}
.r{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:68px}
.r em{font:600 12px/14px var(--sans);font-style:normal;color:var(--ink-2)}
.r u{display:block;width:100%;max-width:44px;margin:1px 0 2px;background:var(--accent);border-radius:var(--radius-s) var(--radius-s) 0 0;text-decoration:none}
.r span{font:400 12px/14px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.r.zamok u{background:var(--data-city);opacity:.55}
.r.zamok svg{color:var(--muted)}
.r.nepovnyi u{background:var(--data-3)}
.pidpys-sir{margin:3px 0 0;font:400 12px/16px var(--sans);color:var(--muted)}
.pik{margin-top:6px}
.pik b{font:700 14px/20px var(--disp)}
.pik span{margin-left:8px;font:400 12px/16px var(--sans);color:var(--muted)}
.pik span:first-child{margin-left:0}
.povt{margin:0;padding:0;list-style:none}
.povt li{padding:3px 8px;margin-top:3px;border-radius:var(--radius-s);background:var(--accent-soft);font:400 13px/18px var(--sans)}
.povt li:first-child{margin-top:0}
.mezha{margin:8px 0 0;font:400 12px/16px var(--sans);color:var(--muted)}
.k-tip .maplibregl-popup-content{background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:var(--radius-m);border:1.5px solid var(--mezha);box-shadow:0 2px 0 var(--bort);font:400 13px/18px var(--sans)}
.k-tip .maplibregl-popup-tip{display:none}
#dzherela{position:absolute;z-index:4;right:8px;bottom:6px;max-width:calc(100% - 16px);padding:1px 8px;border-radius:var(--radius-pill);background:var(--surface);font:400 11px/16px var(--sans);color:var(--muted)}
#dzherela a{color:var(--muted)}
body.tykho #kartka,body.tykho #pidkazka{transition:none!important;animation:none!important}
/* ---- Кадр ролика 1080×1920 (?kadr=1): карта з тим самим кольором, текст крупно, вільні поля зверху й знизу під інтерфейс стрічки ---- */
#kadr[hidden]{display:none}
body.kadr #porivn,body.kadr #verkh-ryad,body.kadr #pidkazky,body.kadr #filtr,body.kadr #info,body.kadr #tykha,body.kadr #dzherela{display:none!important}
#kadr{position:fixed;inset:0;z-index:9;pointer-events:none;color:var(--ink);font-family:var(--sans)}
.kd-verkh{position:absolute;left:72px;top:150px;display:flex;align-items:center;gap:18px;padding:16px 28px 16px 18px;background:var(--surface);border:3px solid var(--mezha);border-radius:24px;box-shadow:0 6px 0 var(--bort);font:700 40px/48px var(--disp)}
.kd-nyz{position:absolute;left:72px;right:72px;bottom:300px;padding:36px 40px;background:var(--surface);border:3px solid var(--mezha);border-radius:32px;box-shadow:0 8px 0 var(--bort)}
.kd-nyz h1{margin:0;font:700 84px/92px var(--disp);letter-spacing:-1px}
.kd-nyz p{margin:6px 0 0;font:400 34px/44px var(--sans);color:var(--muted)}
.kd-chyslo{display:flex;align-items:baseline;gap:18px;margin-top:22px}
.kd-chyslo b{font:800 120px/120px var(--disp);letter-spacing:-2px;color:var(--accent);font-variant-numeric:tabular-nums}
.kd-chyslo span{font:600 36px/44px var(--sans);color:var(--ink-2)}
#kd-hr{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0 0;padding:0;list-style:none}
#kd-hr li{padding:10px 22px;border-radius:999px;background:var(--accent-soft);font:600 32px/40px var(--sans)}

@media (max-width:700px){
 /* На телефоні перемикачі макета гортаються вбік. */
 #porivn{top:8px;bottom:auto;left:8px;right:8px;transform:none;max-width:none;overflow-x:auto;scrollbar-width:none;padding:2px 4px}
 #porivn::-webkit-scrollbar{display:none}
 #porivn .mitka{display:none}
 #porivn button{padding:0 8px;font-size:13px}
 #verkh-ryad{top:64px;left:8px;right:8px;gap:6px}
 #verkh{flex:1;width:auto;padding-left:10px}
 .znachok{width:44px}

 body.shukayu #filtr,body.shukayu #tykha{display:none}

 #kartka{left:0;right:0;top:auto;bottom:0;width:auto;height:45vh;max-height:none;font-size:14px;border-radius:var(--radius-l) var(--radius-l) 0 0;border-width:1.5px 0 0;box-shadow:none;padding:0 20px calc(16px + env(safe-area-inset-bottom));transition:height .2s}
 #kartka.z{animation:kzt .24s cubic-bezier(.2,.8,.3,1)}
 @keyframes kzt{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
 #kartka.tyagnu{transition:none}
 #kartka.vysoka{height:calc(100% - 8px)}
 .k-ruchka{display:block;height:20px;margin:0 -20px;touch-action:none;cursor:grab;position:relative}
 .k-ruchka::after{content:'';position:absolute;left:50%;top:8px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--mezha)}
 .k-shap{touch-action:none;cursor:grab}
 .k-shap h2{font-size:20px;line-height:26px}

 .por,.hr,.nas,.povt li{font-size:14px;line-height:20px}

}

</div>
<div id="verkh-ryad">
 <div id="verkh" class="plashka" role="search">

const PK_ID={background:'bg',water:'water',landuse_park:'park',landcover_wood:'park',park:'park',building:'building'};

function patchStyle(s,t){
 const layers=s.layers.filter(l=>!(l.type==='symbol'&&(/shield/.test(l.id)||l['source-layer']==='poi')));
 let font=null,tc='#888',th='#fff';
 for(const l of layers){ if(l.type!=='symbol'||!l.layout) continue;
  const tf=l.layout['text-field']; if(tf&&JSON.stringify(tf).includes('name')) l.layout['text-field']=UK_NAME;
  if(!font&&l['source-layer']==='transportation_name'&&l.layout['text-font']){font=l.layout['text-font']; const p=l.paint||{};
   tc=KOL[t].label; th=KOL[t].halo}}
 const src=Object.keys(s.sources).find(k=>s.sources[k].type==='vector');
 if(src&&font){const txt=(id,sl,minzoom,filter,size,extra)=>({id:'base-'+id,type:'symbol',source:src,'source-layer':sl,minzoom,filter,
   layout:{'text-field':UK_NAME,'text-font':font,'text-size':size,...extra},paint:{'text-color':tc,'text-halo-color':th,'text-halo-width':1.2}});
  layers.push(txt('park','poi',14,['==',['get','class'],'park'],11,{'text-max-width':8}),
   txt('metro','poi',13,['all',['==',['get','class'],'railway'],['in',['get','subclass'],['literal',['station','subway']]]],11,{'text-max-width':8,'text-offset':[0,.2]}))}
 const K=KOL[t];
 for(const l of layers){const c=PK_ID[l.id]&&K[PK_ID[l.id]];
  if(c){const k=l.type==='background'?'background-color':l.type==='fill'?'fill-color':null; if(k) l.paint={...(l.paint||{}),[k]:c}}
  if(l.id==='building') l.paint={...(l.paint||{}),'fill-outline-color':K.building,'fill-opacity':t==='temna'?.7:.6};
  if(t==='temna'&&l.type==='line'&&l['source-layer']==='transportation'){
   const holovna=/motorway|trunk|primary/.test(l.id);
   l.paint={...(l.paint||{}),'line-color':holovna?zmishaty(K.road,K.label,.18):K.road,'line-opacity':1}}
  if(t==='temna'&&l.type==='line'&&l['source-layer']==='waterway') l.paint={...(l.paint||{}),'line-color':K.water}
  if(l.type==='symbol'&&l.paint) l.paint={...l.paint,'text-color':K.label,'text-halo-color':K.halo,'text-opacity':1}}
 return {...s,layers}}

// ==== Камера: місто цілим без стрибка на старті; адреса камери — своя (не hash MapLibre) ====
const pikselivNaMetr=z=>512*2**z/(40075016*Math.cos(50.45*Math.PI/180));
function chytatyKameru(){const m=location.hash.match(/^#([\d.]+)\/([-\d.]+)\/([-\d.]+)(?:\/([-\d.]+))?(?:\/([-\d.]+))?/);
 return m?{zoom:+m[1],center:[+m[3],+m[2]],bearing:+(m[4]||0),pitch:+(m[5]||0)}:null}
const PITCH=40;
function kameraMista(){let w=180,s=90,e=-180,n=-90;
 for(const c of HEXB.L.values()){const lo=c.cx/MX_,la=c.cy/MY_; if(lo<w)w=lo; if(lo>e)e=lo; if(la<s)s=la; if(la>n)n=la}
 const W=innerWidth, H=innerHeight, pad=telefon()?{t:130,b:90,l:0,r:0}:{t:140,b:72,l:48,r:48};
 const my=la=>Math.log(Math.tan(Math.PI/4+la*Math.PI/360));
 const dx=(e-w)/360*512, dy=(my(n)-my(s))/(2*Math.PI)*512;
 const z=Math.log2(Math.min((W-pad.l-pad.r)/dx,(H-pad.t-pad.b)/dy));
 const cy=(my(n)+my(s))/2, la=(2*Math.atan(Math.exp(cy))-Math.PI/2)*180/Math.PI;
 return {zoom:z+(telefon()?.3:.35),center:[(w+e)/2,la],bearing:0,pitch:PITCH}}
const KAM=chytatyKameru()||(KADR?{zoom:13.15,center:[30.5135,50.4625],bearing:-18,pitch:52}:kameraMista());
// «Переліт» (вау в): старт трохи здалеку, згори й під кутом, далі — повільно до міста з легким нахилом.

map.on('moveend',zapysatyKameru);

// Над кожним стовпчиком — невидимий значок завбільшки з його обрис. Назви вулиць, що на нього налазять, MapLibre не ставить.
// Назви місць (райони, вода, парки, метро) підняті над значками: їх ставлять першими, і вони малюються поверх стовпчиків.
const ZASL_W=32, ZASL_R=[];
for(let r=1;r<=14;r+=.5) ZASL_R.push(r);
function dodatyZaslony(){for(const r of ZASL_R){const id='k-zasl-'+r; if(!map.hasImage(id)) map.addImage(id,{width:ZASL_W,height:Math.round(ZASL_W*r),data:new Uint8Array(ZASL_W*Math.round(ZASL_W*r)*4)})}}
function zaslony(){const src=map.getSource('k-zasl'); if(!src) return;
 const p=map.getPitch()*Math.PI/180, id=colG(), G=GI[id], z=map.getZoom();
 if(p<.14){src.setData({type:'FeatureCollection',features:[]}); MAKET.stan.zaslony=0; return}
 const K_ST=FORMA[id].k, mn=interp(MN[id],z)*ROST, s0=Math.sqrt(3)*G.R*K_ST*pikselivNaMetr(0)/ZASL_W*1.12;
 const f=[...HEXB[id].values()].filter(vershyna).map(b=>{
  const hm=G.R*FORMA[id].H*chastkaVysoty(b)*mn; if(hm<G.R*.6) return null;
  const r=(2*K_ST*Math.cos(p)+hm/G.R*Math.sin(p))/(Math.sqrt(3)*K_ST);
  const im=ZASL_R.find(x=>x>=r)||ZASL_R[ZASL_R.length-1];
  return {type:'Feature',geometry:{type:'Point',coordinates:[b.cx/MX_,b.cy/MY_]},properties:{im:'k-zasl-'+im,s0}}}).filter(Boolean);
 src.setData({type:'FeatureCollection',features:f});
 map.setLayoutProperty('k-zasl','icon-offset',[0,ZASL_W*Math.cos(p)/Math.sqrt(3)]);
 MAKET.stan.zaslony=f.length}
map.on('zoomend',zaslony); map.on('pitchend',zaslony);

 svitlo();
 // Обвідка виділеної соти: (а) тонка чітка; (б) обвідка + світлий край усередині; (в) тонка + «приціл»-кутики.

 map.addLayer({id:'k-hexsel2',type:'line',source:'k-hexsel2',layout:{'line-join':'round','line-cap':'round'},paint:{
  'line-color':VYD_KOL,'line-width':3,'line-opacity':1}});
 dodatyZaslony();
 map.addSource('k-zasl',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'k-zasl',type:'symbol',source:'k-zasl',layout:{'icon-image':['get','im'],'icon-anchor':'bottom','icon-allow-overlap':true,'icon-ignore-placement':false,
  'icon-pitch-alignment':'viewport','icon-rotation-alignment':'viewport',
  'icon-size':['interpolate',['exponential',2],['zoom'],6,['*',['get','s0'],2**6],17,['*',['get','s0'],2**17]]},paint:{'icon-opacity':0}});
 // Назви місць — над стовпчиками, тож їм власний контраст: світлий текст із темною обвідкою в темній темі й навпаки.

 map.addSource('k-selzasl',{type:'geojson',data:{type:'FeatureCollection',features:[]}});

 const obr=k=>{map.getSource('k-hexsel').setData({type:'Feature',geometry:{type:'LineString',coordinates:hexPoly(b.cx,b.cy,G.R,k)[0]}});
  map.getSource('k-hexsel2').setData(prytsil(b.cx,b.cy,G.R*1.2*k))};
 cancelAnimationFrame(ANIM_SEL); obr(1);
 if(TYKHO||!zRukhom){map.setPaintProperty('k-hexsel','line-opacity',1); map.setPaintProperty('k-hexsel2','line-opacity',1); return}
 const t0=performance.now();
 const krok=t=>{const x=(t-t0)/1000;
  if(x<.26){const u=x/.26, k=.86+.14*(1-(1-u)**3)+.035*Math.sin(Math.PI*u); obr(k)} else if(x<.3) obr(1);
  const dykh=.85+.15*Math.cos(2*Math.PI*x/2.8); map.setPaintProperty('k-hexsel','line-opacity',dykh); map.setPaintProperty('k-hexsel2','line-opacity',dykh);
  if(ZARAZ&&ZARAZ.b===b) ANIM_SEL=requestAnimationFrame(krok)};
 ANIM_SEL=requestAnimationFrame(krok)}
// Натиск вершини: осідає на 16 % за 0,08 с і повертається за 0,2 с.
function natysnuty(G,b){ if(TYKHO||!map.getSource('k-col-'+G.id)||!vershyna(b)) return; const t0=performance.now();
 const krok=t=>{const x=(t-t0)/1000, v=x<.08?x/.08:Math.max(0,1-(x-.08)/.2);
  map.setFeatureState({source:'k-col-'+G.id,id:b.k},{tysk:v}); if(x<.28) requestAnimationFrame(krok)};
 requestAnimationFrame(krok)}
let ZARAZ=null;
function vidkryty(G,b,nazva){prybraty(); ZARAZ={G,b,nazva};
 const el=$('#kartka'); el.hidden=false; el.scrollTop=0; document.body.classList.add('k-vidkr'); namalyuvatyKartku();
 el.classList.remove('z'); if(!TYKHO){void el.offsetWidth; el.classList.add('z')}
 if(!KROK){history.pushState({kartka:1},'',location.href); KROK=true}
 vydilyty(G,b,true)}   // етап Б: ні плашки, ні карта не рухаються, коли відкривається картка
MAKET.vidkryty=(id,k)=>vidkryty(GI[id],HEXB[id].get(k));
MAKET.ZARAZ=()=>ZARAZ&&{id:ZARAZ.G.id,k:ZARAZ.b.k,nazva:ZARAZ.nazva||null};
MAKET.zakryty=zakryty;
{const el=$('#kartka'); let st=null;
 el.addEventListener('pointerdown',e=>{if(!telefon()||e.target.closest('.k-x')||!e.target.closest('.k-ruchka,.k-shap')) return;
  st={y:e.clientY,h:el.offsetHeight,rukh:false}; el.setPointerCapture(e.pointerId); el.classList.add('tyagnu')});
 el.addEventListener('pointermove',e=>{if(!st) return; const dy=st.y-e.clientY; if(Math.abs(dy)>4) st.rukh=true;
  if(st.rukh) el.style.height=Math.min(innerHeight-8,Math.max(innerHeight*.45,st.h+dy))+'px'});
 const kin=()=>{if(!st) return; const vys=st.rukh?el.offsetHeight>innerHeight*.72:!el.classList.contains('vysoka');
  st=null; el.classList.remove('tyagnu'); el.style.height=''; el.classList.toggle('vysoka',vys)};
 el.addEventListener('pointerup',kin); el.addEventListener('pointercancel',kin)}
$('#kartka').addEventListener('click',e=>{if(e.target.closest('.k-x')) zakryty()});
addEventListener('keydown',e=>{if(e.key==='Escape') zakryty()});

// ==== Клік: у 3D — найближчий до камери стовпчик під пальцем; повз стовпчики — сота на землі під точкою ====
function zKlyucha(x){const id=x.layer.id.split('-').pop(), G=GI[id], b=G&&HEXB[id].get(x.properties.k); return b&&b.nf?{G,b}:null}
function naZemli(p){const id=colG(), G=GI[id], ll=map.unproject([p.x,p.y]), x=ll.lng*MX_, y=ll.lat*MY_;
 let best=null,bd=(G.R*1.05)**2;
 for(const b of HEXB[id].values()){if(!b.nf) continue; const d=(b.cx-x)**2+(b.cy-y)**2; if(d<bd){bd=d;best={G,b}}}
 return best}
function vluchannya(p,dotyk){const kol=['k-col-'+colG()].filter(x=>map.getLayer(x));
 if(kol.length&&map.getPitch()>8){const f=map.queryRenderedFeatures([p.x,p.y],{layers:kol}).map(zKlyucha).filter(Boolean);
  if(f.length) return f[0];
  if(dotyk){const r=16, ff=map.queryRenderedFeatures([[p.x-r,p.y-r],[p.x+r,p.y+r]],{layers:kol}).map(zKlyucha).filter(Boolean);
   let best=null,bd=1e30;
   for(const h of ff){const q=map.project([h.b.cx/MX_,h.b.cy/MY_]), d=(q.x-p.x)**2+(q.y-p.y)**2; if(d<bd){bd=d;best=h}}
   if(best) return best}}
 return naZemli(p)}
MAKET.vluchannya=vluchannya;
let tPidk=0;
function pidkazka(t){const el=$('#pidkazka'); el.textContent=t; el.classList.add('vyd'); clearTimeout(tPidk); tPidk=setTimeout(()=>el.classList.remove('vyd'),1400)}
const TIP=new maplibregl.Popup({closeButton:false,closeOnClick:false,className:'k-tip',offset:14,maxWidth:'320px'});
map.on('click',e=>{const h=vluchannya(e.point,telefon());
 if(h){TIP.remove(); natysnuty(h.G,h.b); vidkryty(h.G,h.b)} else {zakryty(); pidkazka('Тут немає подій у даних')}});
// Число соти — у підказці при наведенні (ПК).
let NAV=null;
function navesty(h){const kl=x=>x&&x.G.id+':'+x.b.k; if(kl(h)===kl(NAV)) return;
 for(const [x,v] of [[NAV,false],[h,true]]) if(x) for(const src of ['k-hex-','k-col-']) if(map.getSource(src+x.G.id)) map.setFeatureState({source:src+x.G.id,id:x.b.k},{naved:v});
 NAV=h}
map.on('mousemove',e=>{ if(telefon()) return; const h=vluchannya(e.point,false);
 map.getCanvas().style.cursor=h?'pointer':''; navesty(h);
 if(!h) return TIP.remove();
 const t=h.b.nf<5?'Мало даних':`${fmt(h.b.nf)} ${pl(h.b.nf,'подія','події','подій')}`;
 TIP.setLngLat(e.lngLat).setHTML(`<b>${t}</b>${vershyna(h.b)?' · вершина':''}`).addTo(map)});
map.on('mouseout',()=>{TIP.remove(); navesty(null)});

// ==== Кадр ролика 1080×1920: район цілим числом (лише суми, як і решта безкоштовного; без адрес) ====
if(KADR){document.body.classList.add('kadr'); $('#kadr').hidden=false;
 const ray=[...HEXB.L.values()].filter(b=>/^Поділ/.test(b.rayon)), n=ray.reduce((x,b)=>x+b.n,0);
 const g=HRUPY.map((h,i)=>[h[1],ray.reduce((x,b)=>x+b.g[i],0)]).sort((a,b)=>b[1]-a[1]).slice(0,3);
 $('#kd-nazva').textContent=(ray[0]&&ray[0].rayon||'Подільський')+' район';
 $('#kd-pid').textContent='Київ · '+D.meta.period;
 $('#kd-n').textContent=fmt(n); $('#kd-n-pid').textContent=pl(n,'подія','події','подій')+' у даних';
 $('#kd-hr').innerHTML=g.map(([t,v])=>`<li>${esc(t)}<b>${fmt(v)}</b></li>`).join('')}
map.on('zoomend',()=>navesty(null));
