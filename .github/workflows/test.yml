name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: locations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d locations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: PostgreSQL location integration
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/locations_test
        run: python -m unittest discover -s tests -p test_postgres_location_integration.py -v
