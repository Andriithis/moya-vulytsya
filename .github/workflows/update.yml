name: Старе оновлення карти — вимкнено

# Старий процес отримував тексти з Реєстру та зберігав дані у Git.
# Розклад і публікацію прибрано відповідно до правил проєкту.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Пояснення стану
        run: |
          echo 'Старий процес вимкнено. Завантаження та публікація не виконуються.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production PostgreSQL і дозволений масовий канал текстів ще потрібно налаштувати. Див. docs/08-stan.md.' >> "$GITHUB_STEP_SUMMARY"
